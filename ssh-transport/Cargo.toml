[package]
name = "ssh-transport"
version = "0.1.0"
edition = "2021"
# The russh transport + SFTP crate — PURE RUST, deliberately FFI-free
# (FFI-ownership flip, 2026-09-12): each consuming app designs and tests
# its own FFI wrapper over this API. Extracted from conch at S1, moved
# here at S2. Exact pins travel with the crate — russh was probe-verified
# against the real-OpenSSH matrix (conch PLAN.md W9).
[dependencies]
russh = "=0.63.2"
russh-sftp = "=3.0.0"
# Non-optional here: this crate's whole job is the async transport.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
thiserror = "2"
# Host-key blob fingerprints (known_hosts module) — same pin as conch's copy.
sha2 = "=0.11.0"
[lib]
name = "ssh_transport"
