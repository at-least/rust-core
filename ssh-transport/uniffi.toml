# Bindings wiring for the second UniFFI namespace inside conch's single
# dylib/framework (S1, PLAN.md §3.6).
[bindings.kotlin]
# There is no libssh_transport.so — this namespace's FFI lives in
# terminal-core's cdylib, so the generated Kotlin must JNA-load that.
cdylib_name = "terminal_core"
[bindings.swift]
# Share the existing C module so both namespaces' Swift bindings sit in
# the one TerminalCoreKit target (their headers concatenate: every
# declaration is individually UNIFFI_FFIDEF_*-guarded).
ffi_module_name = "terminal_coreFFI"
# Keep the generated header's FILE name distinct so both crates' bindgen
# outputs can coexist in one out-dir before the regen script merges them.
ffi_module_filename = "ssh_transportFFI"
